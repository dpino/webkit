<!DOCTYPE html>
<html>
<head>
<script src="../../../../../resources/js-test.js"></script>
<script src="../../../../../resources/ui-helper.js"></script>
<style>
.box {
    position: absolute;
    left: 20px;
    width: 100px;
    height: 100px;
}
#unhandled { top: 150px; background: green; }
#handled { top: 270px; background: blue; }
#sentinel { top: 390px; background: gray; }
</style>
</head>
<body>
<div id="unhandled" class="box"></div>
<div id="handled" class="box"></div>
<div id="sentinel" class="box"></div>
<div id="console"></div>
<script>
description("Tests that a tap whose touch events are not handled produces a synthetic click without dispatching a second pair of pointer events, and that a tap whose touch events are handled does not produce a synthetic click.");
window.jsTestIsAsync = true;

let events = [];
for (const type of ["pointerdown", "pointerup", "mousedown", "mouseup", "click"]) {
    document.addEventListener(type, (event) => {
        if (event.target.id === "sentinel")
            return;
        events.push({ type: event.type, pointerType: event.pointerType, target: event.target.id });
    }, true);
}

document.getElementById("handled").addEventListener("touchstart", (event) => event.preventDefault());

function count(type, target) {
    return events.filter((event) => event.type === type && event.target === target).length;
}

function pointerTypes(type, target) {
    return events.filter((event) => event.type === type && event.target === target).map((event) => event.pointerType).join(",");
}

function tap(element) {
    const x = element.offsetLeft + element.offsetWidth / 2;
    const y = element.offsetTop + element.offsetHeight / 2;
    eventSender.clearTouchPoints();
    eventSender.addTouchPoint(x, y);
    eventSender.touchStart();
    eventSender.releaseTouchPoint(0);
    eventSender.touchEnd();
}

// Events for a tap are delivered in order, so once the sentinel is clicked all the
// events generated by the previous tap have been dispatched.
function tapAndWaitForSentinel(element) {
    return new Promise((resolve) => {
        const sentinel = document.getElementById("sentinel");
        sentinel.addEventListener("click", resolve, { once: true });
        tap(element);
        tap(sentinel);
    });
}

onload = async () => {
    if (!window.eventSender) {
        testFailed("This test requires eventSender.");
        finishJSTest();
        return;
    }

    await UIHelper.renderingUpdate();

    debug("Tap with unhandled touch events:");
    await tapAndWaitForSentinel(document.getElementById("unhandled"));
    shouldBe("count('pointerdown', 'unhandled')", "1");
    shouldBeEqualToString("pointerTypes('pointerdown', 'unhandled')", "touch");
    shouldBe("count('pointerup', 'unhandled')", "1");
    shouldBeEqualToString("pointerTypes('pointerup', 'unhandled')", "touch");
    shouldBe("count('mousedown', 'unhandled')", "1");
    shouldBe("count('mouseup', 'unhandled')", "1");
    shouldBe("count('click', 'unhandled')", "1");

    debug("");
    debug("Tap with handled touch events:");
    await tapAndWaitForSentinel(document.getElementById("handled"));
    shouldBe("count('pointerdown', 'handled')", "1");
    shouldBe("count('pointerup', 'handled')", "1");
    shouldBe("count('mousedown', 'handled')", "0");
    shouldBe("count('mouseup', 'handled')", "0");
    shouldBe("count('click', 'handled')", "0");

    debug("");
    finishJSTest();
};
</script>
</body>
</html>
